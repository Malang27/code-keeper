---
# GitLab Role - Main Tasks

- name: Add GitLab repository GPG key
  apt_key:
    url: https://packages.gitlab.com/gitlab/gitlab-ce/gpgkey
    state: present
  when: ansible_os_family == "Debian"

- name: Add GitLab CE repository
  apt_repository:
    repo: "deb https://packages.gitlab.com/gitlab/gitlab-ce/ubuntu/ {{ ansible_distribution_release }} main"
    state: present
    filename: gitlab-ce
  when: ansible_os_family == "Debian"

- name: Install GitLab CE
  apt:
    name: gitlab-ce
    state: present
    update_cache: yes
  environment:
    EXTERNAL_URL: "{{ gitlab_external_url }}"
  when: ansible_os_family == "Debian"

- name: Create GitLab configuration directory
  file:
    path: /etc/gitlab
    state: directory
    mode: '0755'

- name: Configure GitLab
  template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: '0600'
  notify: reconfigure gitlab

- name: Enable and start GitLab
  systemd:
    name: gitlab-runsvdir
    enabled: yes
    state: started

- name: Configure GitLab initial root password
  block:
    - name: Check if initial root password file exists
      stat:
        path: /etc/gitlab/initial_root_password
      register: initial_password_file

    - name: Set initial root password
      lineinfile:
        path: /etc/gitlab/initial_root_password
        create: yes
        line: "{{ gitlab_root_password }}"
        mode: '0600'
      when: not initial_password_file.stat.exists

- name: Reconfigure GitLab
  command: gitlab-ctl reconfigure
  changed_when: false

- name: Check GitLab status
  command: gitlab-ctl status
  register: gitlab_status
  changed_when: false

- name: Display GitLab status
  debug:
    var: gitlab_status.stdout_lines
